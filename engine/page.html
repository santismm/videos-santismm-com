<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>EUREKA renderer</title>
<style>
  @font-face { font-family: 'Space Grotesk'; src: url(fonts/SpaceGrotesk-latin.woff2) format('woff2'); font-weight: 300 700; }
  @font-face { font-family: 'Inter'; src: url(fonts/Inter-latin.woff2) format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/JetBrainsMono-Medium.ttf); font-weight: 500; }
  @font-face { font-family: 'JetBrains Mono'; src: url(fonts/JetBrainsMono-Bold.ttf); font-weight: 700; }
  html, body { margin: 0; padding: 0; background: #070a13; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #070a13;
           font-family: 'Inter', sans-serif; color: #dbe2ee; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  .display { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .scene { position: absolute; inset: 0; will-change: transform, opacity; }
  .center { left: 50%; transform: translateX(-50%); }
  svg { overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"></div>
  <div class="layer" id="camera"><div class="layer" id="scenes"></div></div>
  <div class="layer" id="chrome"></div>
  <div class="layer" id="captions"></div>
</div>
<script src="lib.js"></script>
<script src="components.js"></script>
<script>
  // El renderer inyecta el timeline y el script de escenas del vídeo.
  window.__boot = async function (timeline, scenesSrc) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = scenesSrc; s.onload = res; s.onerror = () => rej(new Error('no se pudo cargar ' + scenesSrc));
      document.body.appendChild(s);
    });
    await document.fonts.load('700 80px "Space Grotesk"');
    await document.fonts.load('500 30px "JetBrains Mono"');
    await document.fonts.load('700 30px "JetBrains Mono"');
    await document.fonts.load('600 30px "Inter"');
    await document.fonts.ready;
    return EUREKA.init(timeline);
  };
</script>
</body>
</html>
